name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib pyshacl
      - run: python -m unittest discover -s tests -v
      - name: em-dash gate
        run: |
          ! grep -rn $'—' README.md docs/ ontology/ queries/ || (echo "em dash found" && exit 1)
